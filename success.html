<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Переход к тесту — Решай360</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#090d16] text-white flex items-center justify-center h-screen">
    <div class="text-center space-y-3 p-6 max-w-sm bg-slate-900 border border-slate-800 rounded-2xl shadow-xl">
        <div class="inline-block animate-spin text-indigo-500 text-3xl mb-1">
            <i class="fa-solid fa-spinner"></i>
        </div>
        <h1 class="text-lg font-bold">Оплата прошла успешно!</h1>
        <p class="text-xs text-slate-400">Открываем вашу диагностику...</p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const productKey = urlParams.get('productKey');
        const email = urlParams.get('email');
        const studentName = urlParams.get('studentName');

        // Словарь соответствия ключей продуктов и файлов тестов
        const testFiles = {
            '7': 'test_7.html',
            '8': 'test_8.html',
            '9': 'test_9.html',
            '10': 'test_10.html',
            '11': 'test_11.html'
        };

        const targetFile = testFiles[productKey] || 'index.html';

        // Мгновенный переход к тесту через 1 секунду
        setTimeout(() => {
            window.location.href = `${targetFile}?name=${encodeURIComponent(studentName)}&email=${encodeURIComponent(email)}`;
        }, 1000);
    </script>
</body>
</html>

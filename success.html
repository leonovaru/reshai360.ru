<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Проверка оплаты — Решай360</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Яндекс.Метрика -->
    <script type="text/javascript" >
       (function(m,e,t,r,i,k,a){m[i]=m[i]||function(){(m[i].a=m[i].a||[]).push(arguments)};
       m[i].l=1*new Date();
       for (var j = 0; j < document.scripts.length; j++) {if (document.scripts[j].src === r) { return; }}
       k=e.createElement(t),a=e.getElementsByTagName(t)[0],k.async=1,k.src=r,a.parentNode.insertBefore(k,a)})
       (window, document, "script", "https://mc.yandex.ru/metrika/tag.js", "ym");
       ym(113852589, "init", { clickmap:true, trackLinks:true, accurateTrackBounce:true, webvisor:true });
    </script>
    <noscript><div><img src="https://mc.yandex.ru/watch/113852589" style="position:absolute; left:-9999px;" alt="" /></div></noscript>
</head>
<body class="bg-[#090d16] text-white flex items-center justify-center min-h-screen px-4 py-6">
    <div class="w-full max-w-md text-center space-y-4 p-6 sm:p-8 bg-slate-900 border border-slate-800 rounded-2xl shadow-xl">
        <div id="loader" class="inline-block animate-spin text-indigo-400 text-4xl mb-2">
            <i class="fa-solid fa-spinner"></i>
        </div>
        <h1 id="status-title" class="text-xl sm:text-2xl font-bold leading-tight">Проверяем статус оплаты...</h1>
        <p id="status-desc" class="text-sm sm:text-base text-slate-300 leading-relaxed">Секунду, настраиваем вашу диагностику...</p>
        <button id="retry-payment-check" type="button" onclick="window.location.reload()" class="hidden w-full rounded-xl bg-indigo-600 hover:bg-indigo-500 px-4 py-3 text-sm font-bold text-white">Проверить ещё раз</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const requestedProductKey = urlParams.get('productKey');
            const token = urlParams.get('token');

            const testFiles = {
                '7': 'test_7_basic.html',
                '7_basic': 'test_7_basic.html',
                '7_advanced': 'test_7_advanced.html',
                '8': 'test_8_basic.html',
                '8_basic': 'test_8_basic.html',
                '8_advanced': 'test_8_advanced.html',
                '9': 'test_9_basic.html',
                '9_basic': 'test_9_basic.html',
                '9_advanced': 'test_9_advanced.html',
                '10': 'test_10_basic.html',
                '11': 'test_11_basic.html',
                '10_basic': 'test_10_basic.html',
                '10_advanced': 'test_10_advanced.html',
                '11_basic': 'test_11_basic.html',
                '11_advanced': 'test_11_advanced.html'
            };

            if (!token) {
                document.getElementById('loader').style.display = 'none';
                document.getElementById('status-title').innerText = "Ошибка доступа";
                document.getElementById('status-desc').innerHTML = `<span class="text-rose-400">Токен оплаты не найден.</span>`;
                return;
            }

            try {
                const verificationStartedAt = Date.now();
                let result = null;
                let lastStatus = 0;
                // Сначала сервер проверяет статус напрямую в ЮKassa; повторяем коротко,
                // если платёжный статус ещё обновляется.
                for (let attempt = 0; attempt < 10; attempt++) {
                    const response = await fetch('/api/verify-token', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ token })
                    });
                    lastStatus = response.status;
                    result = await response.json();
                    if (result.valid || lastStatus !== 402) break;
                    if (attempt < 9) await new Promise(resolve => setTimeout(resolve, 1000));
                }

                if (result.valid && result.data) {
                    const productKey = result.data.productKey || requestedProductKey || '11';
                    const targetFile = testFiles[productKey];
                    if (!targetFile) {
                        document.getElementById('loader').style.display = 'none';
                        document.getElementById('status-title').innerText = "Ошибка доступа";
                        document.getElementById('status-desc').innerText = "Не удалось определить выбранную диагностику. Обратитесь в поддержку.";
                        return;
                    }
                    localStorage.setItem('studentName', result.data.studentName);
                    localStorage.setItem('studentEmail', result.data.email);
                    localStorage.setItem('testToken', token);

                    // Фиксируем цель Яндекс.Метрики: Успешная оплата
                    if (typeof ym !== 'undefined') {
                        ym(113852589, 'reachGoal', 'successful_payment');
                    }

                    document.getElementById('status-title').innerText = "Оплата успешно подтверждена!";
                    document.getElementById('status-desc').innerText = "Открываем вашу диагностику...";

                    // Небольшая пауза, чтобы пользователь увидел подтверждение оплаты.
                    // Переход происходит не раньше чем через 2 секунды и только после
                    // серверного подтверждения статуса succeeded.
                    const redirectDelay = Math.max(0, 2000 - (Date.now() - verificationStartedAt));
                    setTimeout(() => {
                        window.location.replace(`${targetFile}?token=${encodeURIComponent(token)}`);
                    }, redirectDelay);
                } else {
                    document.getElementById('loader').style.display = 'none';
                    if (lastStatus === 402) {
                        document.getElementById('status-title').innerText = "Платёж ещё подтверждается";
                        document.getElementById('status-desc').innerText = "Банк уже мог принять оплату, но сервер ещё не получил подтверждение от ЮKassa. Подождите немного и нажмите кнопку ниже — повторно оплачивать не нужно.";
                        document.getElementById('retry-payment-check').classList.remove('hidden');
                    } else {
                        document.getElementById('status-title').innerText = "Ошибка доступа";
                        document.getElementById('status-desc').innerHTML = `<span class="text-rose-400">${result.message || 'Ссылка недействительна или уже использована'}</span>`;
                    }
                }
            } catch (err) {
                console.error(err);
                document.getElementById('loader').style.display = 'none';
                document.getElementById('status-title').innerText = "Ошибка соединения";
                document.getElementById('status-desc').innerText = "Не удалось проверить статус оплаты.";
            }
        });
    </script>
</body>
</html>
